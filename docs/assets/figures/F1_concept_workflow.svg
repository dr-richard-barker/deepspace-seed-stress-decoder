   <g id="text_1">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #14304f" x="300.15" y="26.8416" transform="rotate(-0 300.15 26.8416)">DeepSpace Plant-Stress → Germinating-Seed Decoding Framework</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7.8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(41.693178 111.418298)">Input Perturbation Signatures</text>
    <text style="font-size: 7.8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(92.421818 119.907806)"/>
    <text style="font-size: 7.8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(40.570709 128.40158)">• Microgravity &amp; GCR (OSDR)</text>
    <text style="font-size: 7.8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(34.69999 136.891088)">• Decoupled Hypobaria (TabPFN)</text>
    <text style="font-size: 7.8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(30.86824 145.380595)">• Redox Latent Remodeling (CVAE)</text>
    <text style="font-size: 7.8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(27.488037 153.870103)">• MASTA Microarrays (Cold, Wounds)</text>
    <text style="font-size: 7.8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(41.426881 162.359611)">• Hormone &amp; Nutrient Circuits</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(266.814261 74.2529)">Tool 1 — DSRS</text>
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(224.571136 82.959931)">DeepSpace Stress-Recognition System</text>
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(294.823636 91.667119)"/>
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(225.680511 100.37415)">Matches query seed-fingerprint against</text>
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(221.906761 109.081338)">49 reference contrasts across 15 families</text>
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(204.649261 117.788369)">(Gravity, Hypobaria, Radiation, Redox, Tropisms...)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(266.591761 211.744022)">Tool 2 — GSAD</text>
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(238.128011 220.451053)">Germinating-Seed AutoDecoder</text>
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(294.823636 229.158241)"/>
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(235.690511 237.865272)">Projects bulk transcriptomes onto</text>
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(246.573011 246.572459)">123 single-cell seed panels</text>
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(220.902386 255.279647)">(Gehring dev + Liew/Lewsey germination)</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(469.864318 140.281784)">DeepSpace Seed-</text>
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(464.089943 148.988816)">Susceptibility Atlas v8</text>
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(502.551818 157.696003)"/>
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(452.982443 166.403034)">• 15 Germination Cell Types</text>
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(461.360568 175.110222)">• 49 Stressor Contrasts</text>
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(463.586818 183.817253)">• 15 Stressor Families</text>
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(442.449318 192.524284)">• Stage Axis: 0h→12h→24h→48h</text>
   </g>
   <g id="text_6">
    <text style="font-style: italic; font-size: 7.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #1c4a72" x="294.823636" y="138.144" transform="rotate(-0 294.823636 138.144)">“Which space stressor does it resemble?”</text>
   </g>
   <g id="text_7">
    <text style="font-style: italic; font-size: 7.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #1a7a3a" x="294.823636" y="275.6352" transform="rotate(-0 294.823636 275.6352)">“What effect does it have on the seed?”</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(452.337841 290.833609)">Headline Result (v8):</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(418.879716 299.540797)">Columella / Root Cap = 14 / 15 families</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(413.235341 308.247828)">Radicle Apical Meristem = 10 / 15 families</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(411.475341 316.954859)">Early Germination (12h) = Most Vulnerable</text>
   </g>
   <g id="text_9">
